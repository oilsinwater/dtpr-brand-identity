<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716.18 650.66" width="100%" height="100%">
  <defs>
    <style>
      .hex-bg { fill: #001170; }
      .hex-mid { fill: #006ad9; }
      .hex-bot { fill: #cfedff; }
      .hex-wire { fill: none; stroke: #ffffff; stroke-width: 2.16px; stroke-miterlimit: 10; }
      .hex-mono-text {
        font-family: 'Source Code Pro', 'Courier New', monospace;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.05em;
      }
      .text-form { fill: #ffffff; }
      .text-process { fill: #ffffff; }
      .text-semantics { fill: #001170; }
    </style>
  </defs>
  <g id="layered-hexagon">
    <!-- Bottom Pale Blue Layer (Semantics) -->
    <polyline class="hex-bot" points="682.31 437.81 360.23 581.04 33.7 438.49 21.58 501.66 360.18 649.48 694.57 500.78 682.31 437.81" />
    <polyline class="hex-wire" points="21.58 501.66 360.18 649.48 694.57 500.78" />
    <text transform="translate(68, 488) rotate(23.584)" class="hex-mono-text text-semantics">Semantics</text>

    <!-- Middle Royal Blue Layer (Process) -->
    <polyline class="hex-mid" points="669.76 373.35 360.31 510.97 46.1 373.8 33.7 438.49 360.23 581.04 682.31 437.81 669.76 373.35" />
    <polyline class="hex-wire" points="33.7 438.49 360.23 581.04 682.31 437.81" />
    <text transform="translate(90, 428) rotate(23.584)" class="hex-mono-text text-process">Process</text>

    <!-- Top Navy Hexagon Face (Form) -->
    <polygon class="hex-bg" points="359.08 1.14 666.37 103.75 714.95 353.26 360.31 510.97 1.22 354.21 49.08 104.64 359.08 1.14" />
    <polygon class="hex-wire" points="359.08 1.14 666.37 103.75 714.95 353.26 360.31 510.97 1.22 354.21 49.08 104.64 359.08 1.14" />
    <text transform="translate(112, 368) rotate(23.584)" class="hex-mono-text text-form">Form</text>
  </g>
</svg>