        font-family: 'Public Sans', 'Source Code Pro', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .label-top { fill: #ffffff; }
      .label-mid { fill: #ffffff; }
      .label-bot { fill: #002684; }
    </style>
  </defs>
  <g>
    <!-- Bottom Layer: Semantics (Pale Blue) -->
    <polyline class="hex-bot" points="682.31 437.81 360.23 581.04 33.7 438.49 21.58 501.66 360.18 649.48 694.57 500.78 682.31 437.81" />
    <text transform="translate(195, 575) rotate(23.5)" class="hex-label label-bot">03 · SEMANTICS — Register &amp; Context</text>

    <!-- Middle Layer: Process (Royal Blue) -->
    <polyline class="hex-mid" points="669.76 373.35 360.31 510.97 46.1 373.8 33.7 438.49 360.23 581.04 682.31 437.81 669.76 373.35" />
    <text transform="translate(190, 505) rotate(23.5)" class="hex-label label-mid">02 · PROCESS — Dynamics &amp; Motion</text>

    <!-- Top Layer: Form (Navy) -->
    <polygon class="hex-bg" points="359.08 1.14 666.37 103.75 714.95 353.26 360.31 510.97 1.22 354.21 49.08 104.64 359.08 1.14" />
    <polygon class="hex-wire" points="359.08 1.14 666.37 103.75 714.95 353.26 360.31 510.97 1.22 354.21 49.08 104.64 359.08 1.14" />

    <!-- Isometric Text on Top Face -->
    <text transform="translate(195, 435) rotate(23.5)" class="hex-label label-top">01 · FORM — Geometry &amp; Palette</text>
  </g>
