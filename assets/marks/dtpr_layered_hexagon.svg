<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716.18 650.66" width="100%" height="100%">
  <defs>
    <style>
      .hex-bg { fill: #002684; }
      .hex-mid { fill: #006ad9; }
      .hex-bot { fill: #cfedff; }
      .hex-wire { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-miterlimit: 10; }
